name: ghw-bcodex-msvc1-cicd

on:
  push:
    branches:
      - develop
      - main
  
  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:
    inputs:
      deploy_option:
        description: 'Deploy option'
        required: true
        type: choice
        options:
          - CI
          - CI + CD

permissions:
  contents: read


env:
  ORG: jhordan01
  APP: ms-bcodex-sprint-msvc1


jobs:
  job_ci:
    runs-on: [self-hosted, runner-dev]
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          echo "Hello World"
          ls -al
          echo {{ github.event_name }}

      - name: stp-dockerLogin
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      

      - name: stp-setupQEMU@v4.2.0
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: all

      - name: stp-setupBuildx@v4.2.0
        uses: docker/setup-buildx-action@v4.2.0
      
      - name: stp-dockerMetadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.ORG }}/${{ env.APP }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch,prefix=branch-,format=refname
            type=raw,value=latest
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v

      - name: stp-MvnCleanVerify
        run: |
          cd ${{ github.workspace }}/app
          mvn -B clean verify

      - name: stp-sonarQube
        run: |
          cd ${{ github.workspace }}/app
          mvn sonar:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: stp-buildImage
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        env:
          DOCKER_BUILD_SUMMARY: true
          DOCKER_BUILD_RECORD_UPLOAD: true
      
      - name: stp-buildSummary
        run: |
          echo "Build Summary:"
          echo "Image Name: ${{ env.ORG }}/${{ env.APP }}" 
          echo "BUILD-Digest: ${{ steps.build.outputs.digest}}"
          echo "META-Tags: ${{ steps.meta.outputs.tags }}"
          echo "META-Labels: ${{ steps.meta.outputs.labels }}"
          echo "META-Annotations: ${{ steps.meta.outputs.annotations }}"
          echo "META-Platforms: ${{ steps.meta.outputs.platforms }}"
          echo "META-Json: ${{ steps.meta.outputs.json }}"